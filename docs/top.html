<!DOCTYPE html>
<html>
<head>
<style>
html {
	scroll-behavior: smooth;
}
body {
	padding: 0px;
	margin: 25px;
	width: 40%;
	background-color: #181616;
	color: #C5C9C5;
	font-family: "IBM Plex Mono", monospace;
}
code
{
	color: #72A7BC;
}
a {
	color: #9ecdff;
	text-decoration: none;
}
a:visited {
	color: #9ecdff;
	text-decoration: none;
}
a:hover {
	color: #c5c5c5;
}
hr {
	background-color: #282727;
	color: #282727;
	height: 1px;
}

.fancy_name
{
	font-family: "Playwrite CA", cursive;
	font-optical-sizing: auto;
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Playwrite+CA:wght@100..400&display=swap" rel="stylesheet">
<meta name="darkreader-lock">
</head>
<body>
<!-- Code embedding blocks -->
<script type="module">
import { codeToHtml } from 'https://esm.sh/shiki';

class CodeEmbed extends HTMLElement
{
	constructor()
	{
		super();
	}

	connectedCallback() {
		const src = this.getAttribute("src");
		if ( src == null )
			return;
		const lang = this.getAttribute("lang");
		if ( lang == null )
			return;

		fetch(src)
			.then(r => r.text())
			.then(text => codeToHtml(text, {
				lang: lang,
				theme: 'kanagawa-dragon'
			}))
			.then(html => this.innerHTML = html);
	}
}
customElements.define("code-embed", CodeEmbed);
</script>
